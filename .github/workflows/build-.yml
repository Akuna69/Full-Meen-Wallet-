name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_NDK_VERSION: 27.2.12479018
  GO_VERSION: '1.24.x'
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Configure Android SDK
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || \
            test -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_DIR="$ANDROID_HOME/cmdline-tools/latest/bin"
          else
            SDKMANAGER_DIR="$ANDROID_HOME/cmdline-tools/16.0/bin"
          fi

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_MANAGER_DIR=$SDKMANAGER_DIR" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          export PATH="$ANDROID_SDK_MANAGER_DIR:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Verify build environment
        run: |
          set -euo pipefail
          export PATH="$ANDROID_SDK_MANAGER_DIR:$ANDROID_HOME/platform-tools:$PATH"
          java -version
          go version
          docker --version
          sdkmanager --version
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_NDK_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

      - name: Prepare Android build files
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          mkdir -p android/apolloui
          cat > android/apolloui/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "build-only-project",
              "storage_bucket": "build-only-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0000000000000001",
                  "android_client_info": {"package_name": "io.muun.apollo"}
                },
                "api_key": [
                  {"current_key": "AIzaSyDummyKeyForBuildOnly0000000000"}
                ]
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Build Rust libraries
        run: |
          set -euo pipefail
          chmod +x libwallet/librs/makelibs.sh
          TARGETS="aarch64-linux-android x86_64-linux-android" \
            libwallet/librs/makelibs.sh

      - name: Build Android wallet AAR
        run: |
          set -euo pipefail
          chmod +x tools/bootstrap-gomobile.sh tools/libwallet-android.sh
          tools/bootstrap-gomobile.sh
          tools/libwallet-android.sh android/libwallet/libs/libwallet.aar
          test -s android/libwallet/libs/libwallet.aar

      - name: Build production debug APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean :android:apolloui:assembleProdDebug \
            --no-daemon \
            --no-parallel \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Confirm APK output
        run: |
          set -euo pipefail
          find android/apolloui/build/outputs/apk -type f -name '*.apk' -print -exec ls -lh {} \\\;
