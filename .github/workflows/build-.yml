name: Build Debug APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/go/bin"
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          gomobile init

      - name: Build Rust Libraries for Android
        run: |
          cd libwallet/librs
          ./makelibs.sh

      - name: Crear google-services.json de prueba
        run: |
          python3 - << 'EOF'
          import json
          pkgs = [
              "io.muun.apollo",
              "io.muun.apollo.debug",
              "io.muun.apollo.regtest",
              "io.muun.apollo.internal.beta",
              "io.muun.apollo.debug.regtest",
              "io.muun.apollo.debug.internal.beta",
          ]
          clients = []
          for i, p in enumerate(pkgs):
              clients.append({
                  "client_info": {
                      "mobilesdk_app_id": f"1:123456789012:android:0123456789abcdef{i:02x}",
                      "android_client_info": { "package_name": p }
                  },
                  "api_key": [{ "current_key": "AIzaSyDummyKeyForBuildOnly0000000000" }]
              })
          data = {
              "project_info": {
                  "project_number": "123456789012",
                  "project_id": "meen-wallet-test",
                  "storage_bucket": "meen-wallet-test.appspot.com"
              },
              "client": clients,
              "configuration_version": "1"
          }
          json.dump(data, open("android/apolloui/google-services.json", "w"), indent=2)
          EOF

      - name: Build Debug APK
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          chmod +x tools/*.sh
          ./gradlew :android:apolloui:assembleProdDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/apolloui/build/outputs/apk/prod/debug/*.apk
