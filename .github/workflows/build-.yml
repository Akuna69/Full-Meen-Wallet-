name: Compilar APK Muun

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Java (necesario para compilar Android)
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Dar permisos de ejecución a Gradle Wrapper
      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      # 4. Compilar la aplicación apuntando al submódulo correcto
      - name: Compilar APK con Gradle
        run: ./gradlew :android:apollo:assembleDebug --warning-mode all

      # 5. Subir la APK generada para que puedas descargarla
      - name: Subir archivo APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            android/apollo/build/outputs/apk/debug/*.apk
            android/apollout/build/outputs/apk/debug/*.apk
